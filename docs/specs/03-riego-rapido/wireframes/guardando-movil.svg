oke="#D9D9D9" stroke-width="1"/><text x="32" y="894" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Registrar una planta</text><text x="32" y="928" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Nombre</text><rect x="32" y="938" width="326" height="44" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="1"/><text x="44" y="966" font-family="system-ui, sans-serif" font-size="16" fill="#212121"></text><rect x="32" y="996" width="200" height="10" rx="5" fill="#D9D9D9"/><rect x="32" y="1016" width="160" height="10" rx="5" fill="#D9D9D9"/><rect x="32" y="1046" width="326" height="44" rx="8" fill="#616161"/><text x="195" y="1074" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Registrar planta</text><line x1="16" y1="1138" x2="374" y2="1138" stroke="#D9D9D9" stroke-width="1"/><text x="16" y="1166" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#616161">Notas del wireframe</text><text x="16" y="1190" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• Solo texto, sin spinner ni animación.</text><text x="16" y="1214" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• Campo, «Guardar riego» y «Cancelar» desactivados:</text><text x="16" y="1234" font-family="system-ui, sans-serif" font-size="14" fill="#616161">  pulsar otra vez no envía un segundo riego.</text><text x="16" y="1258" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• Los «Regar» de otras tarjetas también esperan</text><text x="16" y="1278" font-family="system-ui, sans-serif" font-size="14" fill="#616161">  hasta que la API responda.</text>
