 x="32" y="432" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Ubicación</text><text x="142" y="432" font-family="system-ui, sans-serif" font-size="16" fill="#212121">Mesa 4</text><text x="32" y="458" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Riego cada</text><text x="142" y="458" font-family="system-ui, sans-serif" font-size="16" fill="#212121">2 días</text><rect x="33" y="481" width="324" height="42" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/><text x="195" y="508" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Regar</text><rect x="16" y="556" width="358" height="256" rx="12" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><text x="32" y="592" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Registrar una planta</text><text x="32" y="626" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Nombre</text><rect x="32" y="636" width="326" height="44" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="1"/><text x="44" y="664" font-family="system-ui, sans-serif" font-size="16" fill="#212121"></text><rect x="32" y="694" width="200" height="10" rx="5" fill="#D9D9D9"/><rect x="32" y="714" width="160" height="10" rx="5" fill="#D9D9D9"/><rect x="32" y="744" width="326" height="44" rx="8" fill="#616161"/><text x="195" y="772" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Registrar planta</text><line x1="16" y1="836" x2="374" y2="836" stroke="#D9D9D9" stroke-width="1"/><text x="16" y="864" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#616161">Notas del wireframe</text><text x="16" y="888" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• Cada tarjeta tiene «Regar» a todo el ancho,</text><text x="16" y="908" font-family="system-ui, sans-serif" font-size="14" fill="#616161">  44 px de alto, debajo de los datos.</text><text x="16" y="932" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• El nombre sigue siendo el enlace al detalle.</text><text x="16" y="956" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• «Registrar planta» es el único botón primario.</text>
