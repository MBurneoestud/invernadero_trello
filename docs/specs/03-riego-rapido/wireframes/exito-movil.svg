<rect x="0" y="0" width="390" height="44" rx="0" fill="#F2F2F2"/><line x1="0" y1="44" x2="390" y2="44" stroke="#D9D9D9" stroke-width="1"/><text x="16" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Éxito · CA-1.8.3, CA-1.8.6</text><text x="16" y="92" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#212121">Plantas</text><rect x="16" y="116" width="358" height="254" rx="12" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><text x="32" y="152" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Mandrágora</text><line x1="32" y1="155" x2="132" y2="155" stroke="#212121" stroke-width="1"/><text x="32" y="186" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Especie</text><rect x="142" y="174" width="120" height="10" rx="5" fill="#D9D9D9"/><text x="32" y="212" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Ubicación</text><text x="142" y="212" font-family="system-ui, sans-serif" font-size="16" fill="#212121">Mesa 2</text><text x="32" y="238" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Riego cada</text><text x="142" y="238" font-family="system-ui, sans-serif" font-size="16" fill="#212121">3 días</text><rect x="33" y="261" width="324" height="42" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/><text x="195" y="288" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Regar</text><rect x="32" y="316" width="326" height="38" rx="12" fill="#F2F2F2" stroke="#9E9E9E" stroke-width="1"/><circle cx="52" cy="337" r="8" fill="none" stroke="#212121" stroke-width="2"/><polyline points="48,337 51,340 56,334" fill="none" stroke="#212121" stroke-width="2"/><text x="72" y="342" font-family="system-ui, sans-serif" font-size="14" fill="#212121">Riego guardado para Mandrágora.</text><rect x="16" y="386" width="358" height="204" rx="12" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><text x="32" y="422" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Helecho lunar</text><line x1="32" y1="425" x2="162" y2="425" stroke="#212121" stroke-width="1"/><text x="32" y="456" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Especie</text><rect x="142" y="444" width="120" height="10" rx="5" fill="#D9D9D9"/><text x="32" y="482" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Ubicación</text><text x="142" y="482" font-family="system-ui, sans-serif" font-size="16" fill="#212121">Mesa 4</text><text x="32" y="508" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Riego cada</text><text x="142" y="508" font-family="system-ui, sans-serif" font-size="16" fill="#212121">2 días</text><rect x="33" y="531" width="324" height="42" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/><text x="195" y="558" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Regar</text><rect x="16" y="606" width="358" height="256" rx="12" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><text x="32" y="642" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Registrar una planta</text><text x="32" y="676" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Nombre</text><rect x="32" y="686" width="326" height="44" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="1"/><text x="44" y="714" font-family="system-ui, sans-serif" font-size="16" fill="#212121"></text><rect x="32" y="744" width="200" height="10" rx="5" fill="#D9D9D9"/><rect x="32" y="764" width="160" height="10" rx="5" fill="#D9D9D9"/><rect x="32" y="794" width="326" height="44" rx="8" fill="#616161"/><text x="195" y="822" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Registrar planta</text><line x1="16" y1="886" x2="374" y2="886" stroke="#D9D9D9" stroke-width="1"/><text x="16" y="914" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#616161">Notas del wireframe</text><text x="16" y="938" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• El panel se cierra y el mensaje aparece dentro</text><text x="16" y="958" font-family="system-ui, sans-serif" font-size="14" fill="#616161">  de la misma tarjeta, debajo de «Regar».</text><text x="16" y="982" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• La lista no se recarga ni salta: se queda en la</text><text x="16" y="1002" font-family="system-ui, sans-serif" font-size="14" fill="#616161">  misma posición de desplazamiento.</text><text x="16" y="1026" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• El mensaje desaparece al abrir otro panel.</text><text x="16" y="1050" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• En el detalle: riego de hoy, 500 ml, «sin cuidador».</text>
</svg>
