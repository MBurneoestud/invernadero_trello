y="420" width="326" height="44" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="1"/><text x="44" y="448" font-family="system-ui, sans-serif" font-size="16" fill="#212121">500</text><rect x="33" y="481" width="324" height="42" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/><text x="195" y="508" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Guardar riego</text><rect x="33" y="533" width="324" height="42" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/><text x="195" y="560" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Cancelar</text><rect x="16" y="608" width="358" height="204" rx="12" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><text x="32" y="644" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Helecho lunar</text><line x1="32" y1="647" x2="162" y2="647" stroke="#212121" stroke-width="1"/><text x="32" y="678" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Especie</text><rect x="142" y="666" width="120" height="10" rx="5" fill="#D9D9D9"/><text x="32" y="704" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Ubicación</text><text x="142" y="704" font-family="system-ui, sans-serif" font-size="16" fill="#212121">Mesa 4</text><text x="32" y="730" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Riego cada</text><text x="142" y="730" font-family="system-ui, sans-serif" font-size="16" fill="#212121">2 días</text><rect x="33" y="753" width="324" height="42" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/><text x="195" y="780" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Regar</text><rect x="16" y="828" width="358" height="256" rx="12" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/><text x="32" y="864" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Registrar una planta</text><text x="32" y="898" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Nombre</text><rect x="32" y="908" width="326" height="44" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="1"/><text x="44" y="936" font-family="system-ui, sans-serif" font-size="16" fill="#212121"></text><rect x="32" y="966" width="200" height="10" rx="5" fill="#D9D9D9"/><rect x="32" y="986" width="160" height="10" rx="5" fill="#D9D9D9"/><rect x="32" y="1016" width="326" height="44" rx="8" fill="#616161"/><text x="195" y="1044" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Registrar planta</text><line x1="16" y1="1108" x2="374" y2="1108" stroke="#D9D9D9" stroke-width="1"/><text x="16" y="1136" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#616161">Notas del wireframe</text><text x="16" y="1160" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• El panel se abre dentro de la tarjeta, debajo</text><text x="16" y="1180" font-family="system-ui, sans-serif" font-size="14" fill="#616161">  de «Regar», que queda marcado como abierto.</text><text x="16" y="1204" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• No hay campos de fecha ni de cuidador.</text><text x="16" y="1228" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• «Cantidad (ml)» abre el teclado numérico.</text><text x="16" y="1252" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• Pulsar «Regar» en «Helecho lunar» cierra este</text><text x="16" y="1272" font-family="system-ui, sans-serif" font-size="14" fill="#616161">  panel sin guardar y abre el de esa tarjeta.</text><text x="16" y="1296" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• «Cancelar» o volver a pulsar «Regar» cierra el</text><text x="16" y="1316" font-family="system-ui, sans-serif" font-size="14" fill="#616161">  panel sin registrar nada.</text><text x="16" y="1340" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• «Guardar riego» es secundario: el primario sigue</text><text x="16" y="1360" font-family="system-ui, sans-serif" font-size="14" fill="#616161">  siendo «Registrar planta».</text>
</svg>
