<rect x="0" y="0" width="1280" height="44" rx="0" fill="#F2F2F2"/><line x1="0" y1="44" x2="1280" y2="44" stroke="#D9D9D9" stroke-width="1"/><text x="16" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Panel abierto · CA-1.8.1</text><text x="48" y="100" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#212121">Plantas</text><rect x="48" y="124" width="1184" height="48" rx="0" fill="#616161"/><text x="64" y="154" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Nombre</text><text x="344" y="154" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Especie</text><text x="624" y="154" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Ubicación</text><text x="864" y="154" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Riego cada</text><text x="1064" y="154" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Acción</text><text x="64" y="210" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121">Mandrágora</text><line x1="64" y1="213" x2="144" y2="213" stroke="#212121" stroke-width="1"/><rect x="344" y="198" width="160" height="10" rx="5" fill="#D9D9D9"/><text x="624" y="210" font-family="system-ui, sans-serif" font-size="16" fill="#212121">Mesa 2</text><text x="864" y="210" font-family="system-ui, sans-serif" font-size="16" fill="#212121">3 días</text><rect x="1065" y="183" width="118" height="42" rx="8" fill="#F2F2F2" stroke="#616161" stroke-width="2"/><text x="1124" y="210" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Regar</text><rect x="48" y="236" width="1184" height="112" rx="0" fill="#F2F2F2"/><line x1="48" y1="236" x2="1232" y2="236" stroke="#D9D9D9" stroke-width="1"/><text x="64" y="276" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121">Regar Mandrágora</text><text x="64" y="300" font-family="system-ui, sans-serif" font-size="14" fill="#616161">Se anotará con fecha de hoy, 18 nov 2026.</text><text x="624" y="266" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Cantidad (ml)</text><rect x="624" y="276" width="200" height="44" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="1"/><text x="636" y="304" font-family="system-ui, sans-serif" font-size="16" fill="#212121">500</text><rect x="865" y="277" width="158" height="42" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/><text x="944" y="304" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Guardar riego</text><rect x="1041" y="277" width="118" height="42" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/><text x="1100" y="304" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Cancelar</text><line x1="48" y1="348" x2="1232" y2="348" stroke="#D9D9D9" stroke-width="1"/><text x="64" y="386" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121">Helecho lunar</text><line x1="64" y1="389" x2="168" y2="389" stroke="#212121" stroke-width="1"/><rect x="344" y="374" width="160" height="10" rx="5" fill="#D9D9D9"/><text x="624" y="386" font-family="system-ui, sans-serif" font-size="16" fill="#212121">Mesa 4</text><text x="864" y="386" font-family="system-ui, sans-serif" font-size="16" fill="#212121">2 días</text><rect x="1065" y="359" width="118" height="42" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/><text x="1124" y="386" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Regar</text><line x1="48" y1="412" x2="1232" y2="412" stroke="#D9D9D9" stroke-width="1"/><text x="64" y="450" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121">Orquídea estelar</text><line x1="64" y1="453" x2="192" y2="453" stroke="#212121" stroke-width="1"/><rect x="344" y="438" width="160" height="10" rx="5" fill="#D9D9D9"/><text x="624" y="450" font-family="system-ui, sans-serif" font-size="16" fill="#212121">Mesa 1</text><text x="864" y="450" font-family="system-ui, sans-serif" font-size="16" fill="#212121">5 días</text><rect x="1065" y="423" width="118" height="42" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="2"/><text x="1124" y="450" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#212121" text-anchor="middle">Regar</text><line x1="48" y1="476" x2="1232" y2="476" stroke="#D9D9D9" stroke-width="1"/><rect x="48" y="124" width="1184" height="352" rx="0" fill="none" stroke="#D9D9D9" stroke-width="1"/><text x="72" y="548" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#212121">Registrar una planta</text><text x="72" y="584" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#212121">Nombre</text><rect x="72" y="594" width="400" height="44" rx="8" fill="#FFFFFF" stroke="#616161" stroke-width="1"/><text x="84" y="622" font-family="system-ui, sans-serif" font-size="16" fill="#212121"></text><rect x="72" y="652" width="300" height="10" rx="5" fill="#D9D9D9"/><rect x="72" y="680" width="200" height="44" rx="8" fill="#616161"/><text x="172" y="708" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Registrar planta</text><rect x="48" y="508" width="600" height="240" rx="12" fill="none" stroke="#D9D9D9" stroke-width="1"/><line x1="48" y1="780" x2="1232" y2="780" stroke="#D9D9D9" stroke-width="1"/><text x="48" y="808" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#616161">Notas del wireframe</text><text x="48" y="832" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• El panel ocupa una fila a todo el ancho, justo debajo de la fila de «Mandrágora»; solo hay uno abierto.</text><text x="48" y="856" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• «Regar» de la fila abierta queda marcado como abierto; pulsarlo otra vez equivale a «Cancelar».</text><text x="48" y="880" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• Pulsar «Regar» en «Helecho lunar» cierra este panel sin guardar y abre el suyo.</text><text x="48" y="904" font-family="system-ui, sans-serif" font-size="14" fill="#616161">• Sin campos de fecha ni de cuidador. Los demás estados (guardando, errores, aviso) usan el mismo contenido que en móvil, en esta fila.</text>
</svg>
